---
- name: Set hostname
  paloaltonetworks.panos.panos_type_cmd:
    provider: "{{ current_firewall_provider }}"
    cmd: set
    xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
    element: "<hostname>{{ firewall_info.hostname }}</hostname>"
  when: not ansible_check_mode

- name: Enable advanced routing
  panos_advanced_routing:
    ip_address: "{{ firewall_info.staging_ip }}"
    username: "{{ firewall_username }}"
    password: "{{ firewall_password }}"
    enabled: "{{ palo_alto_bootstrap_advanced_routing_enabled | bool }}"
  register: palo_alto_bootstrap_advanced_routing_result

- name: Remove default security rule
  paloaltonetworks.panos.panos_security_rule:
    provider: "{{ current_firewall_provider }}"
    state: absent
    rule_name: rule1
    vsys: vsys1
  register: palo_alto_bootstrap_remove_default_security_rule
  failed_when: false
  when: not ansible_check_mode

- name: Remove default virtual router
  paloaltonetworks.panos.panos_virtual_router:
    provider: "{{ current_firewall_provider }}"
    name: default
    state: absent
  register: palo_alto_bootstrap_remove_default_virtual_router
  failed_when: false
  when: not ansible_check_mode

- name: Remove default logical router
  paloaltonetworks.panos.panos_logical_router:
    provider: "{{ current_firewall_provider }}"
    name: default
    state: absent
  register: palo_alto_bootstrap_remove_default_logical_router
  failed_when: false
  when: not ansible_check_mode

- name: Remove default virtual wire
  paloaltonetworks.panos.panos_virtual_wire:
    provider: "{{ current_firewall_provider }}"
    state: absent
    name: default-vwire
  register: palo_alto_bootstrap_remove_default_virtual_wire
  failed_when: false
  when: not ansible_check_mode

- name: Remove trust and untrust zones
  paloaltonetworks.panos.panos_zone:
    provider: "{{ current_firewall_provider }}"
    state: absent
    zone: "{{ item }}"
    vsys: vsys1
  loop:
    - trust
    - untrust
  register: palo_alto_bootstrap_remove_default_zones
  failed_when: false
  when: not ansible_check_mode

- name: Remove default ethernet interfaces
  paloaltonetworks.panos.panos_interface:
    provider: "{{ current_firewall_provider }}"
    state: absent
    if_name: "{{ item }}"
  loop:
    - ethernet1/1
    - ethernet1/2
  register: palo_alto_bootstrap_remove_default_ethernet_interfaces
  failed_when: false
  when: not ansible_check_mode

- name: Disable SIP ALG
  paloaltonetworks.panos.panos_type_cmd:
    provider: "{{ current_firewall_provider }}"
    cmd: set
    xpath: "/config/shared/alg-override/application/entry[@name='sip']"
    element: "<alg-disabled>yes</alg-disabled>"
  when: not ansible_check_mode

- name: Set telemetry region
  paloaltonetworks.panos.panos_config_element:
    provider: "{{ current_firewall_provider }}"
    xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
    element: |
      <device-telemetry>
        <device-health-performance>yes</device-health-performance>
        <product-usage>yes</product-usage>
        <threat-prevention>yes</threat-prevention>
        <region>{{ palo_alto_bootstrap_telemetry_region }}</region>
      </device-telemetry>
    state: present
  when: not ansible_check_mode

- name: Remove default override for Threats scheduler
  paloaltonetworks.panos.panos_type_cmd:
    provider: "{{ current_firewall_provider }}"
    cmd: delete
    xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/update-schedule/threats"
  failed_when: false
  when: not ansible_check_mode

- name: Refresh license
  panos_lic_fetch:
    ip_address: "{{ firewall_info.staging_ip }}"
    username: "{{ firewall_username }}"
    password: "{{ firewall_password }}"

- name: Update content
  paloaltonetworks.panos.panos_dynamic_updates:
    provider: "{{ current_firewall_provider }}"
  when: not ansible_check_mode

- name: Download latest anti-virus updates
  panos_av_update:
    ip_address: "{{ firewall_info.staging_ip }}"
    username: "{{ firewall_username }}"
    password: "{{ firewall_password }}"
  when: not ansible_check_mode

- name: Apply standalone firewall configuration
  ansible.builtin.include_role:
    name: palo_alto_standalone_config
  when: not add_to_panorama | bool

- name: Apply firewall-side Panorama configuration
  ansible.builtin.include_role:
    name: palo_alto_panorama_config
    tasks_from: firewall
  when: add_to_panorama | bool

- name: Check for pending changes
  paloaltonetworks.panos.panos_op:
    provider: "{{ current_firewall_provider }}"
    cmd: show config list changes
  register: palo_alto_bootstrap_pending_changes

- name: Commit configuration
  paloaltonetworks.panos.panos_commit_firewall:
    provider: "{{ current_firewall_provider }}"
    sync: true
  when:
    - palo_alto_bootstrap_pending_changes.stdout is defined
    - palo_alto_bootstrap_pending_changes.stdout | string | trim | length > 0
    - "'No changes' not in (palo_alto_bootstrap_pending_changes.stdout | default(''))"
    - not ansible_check_mode

- name: Get current PAN-OS version
  paloaltonetworks.panos.panos_facts:
    provider: "{{ current_firewall_provider }}"
    gather_subset:
      - system
  register: palo_alto_bootstrap_firewall_facts

- name: Update PAN-OS version if needed
  paloaltonetworks.panos.panos_software:
    provider: "{{ current_firewall_provider }}"
    version: "{{ panos_version }}"
    download: true
    install: true
    restart: true
    timeout: 3600
  register: palo_alto_bootstrap_software_update
  when:
    - panos_version is defined
    - panos_version | string | trim | length > 0
    - palo_alto_bootstrap_firewall_facts is succeeded
    - palo_alto_bootstrap_firewall_facts.ansible_facts is defined
    - (palo_alto_bootstrap_firewall_facts.ansible_facts.system['sw-version'] | default('')) != panos_version
    - not ansible_check_mode

- name: Wait for HTTPS to become reachable after reboot
  ansible.builtin.wait_for:
    host: "{{ firewall_info.staging_ip }}"
    port: 443
    state: started
    delay: 10
    timeout: 900
  when:
    - palo_alto_bootstrap_software_update is defined
    - palo_alto_bootstrap_software_update.changed | default(false) | bool
    - not ansible_check_mode

- name: Wait for firewall API after reboot
  paloaltonetworks.panos.panos_check:
    provider: "{{ current_firewall_provider }}"
    initial_delay: 300
    interval: 30
    timeout: 600
  register: palo_alto_bootstrap_reboot_check
  until: palo_alto_bootstrap_reboot_check is succeeded
  retries: 10
  delay: 30
  changed_when: true
  when:
    - palo_alto_bootstrap_software_update is defined
    - palo_alto_bootstrap_software_update.changed | default(false) | bool
    - not ansible_check_mode
