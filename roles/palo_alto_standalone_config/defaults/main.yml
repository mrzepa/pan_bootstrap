palo_alto_standalone_config_login_banner: >-
  This is a private system. Unauthorized access is prohibited and activity may be monitored.
palo_alto_standalone_config_palo_alto_update_applications:
  - paloalto-updates
palo_alto_standalone_config_interface_management_profile: PING
palo_alto_standalone_config_lldp_profile: LLDP-PR
palo_alto_standalone_config_internal_zone_protection_profile: Internal-Zone-Protect
palo_alto_standalone_config_internet_zone_protection_profile: Internet-ZoneProtect-Protect
