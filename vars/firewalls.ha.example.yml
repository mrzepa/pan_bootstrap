---
# Example local HA pair input. Use this when Panorama is not managing HA.

panos_version: "12.1.7-h1"
firewall_username: admin

add_to_panorama: false
deployment_mode: ha_pair

ha:
  ha1_interface: "ha1-a"
  ha2_interface: "ha2-a"
  group_id: 1
  netmask: "255.255.255.252"
  primary_ha1_ip: "169.254.0.1"
  secondary_ha1_ip: "169.254.0.2"
  primary_priority: 90
  secondary_priority: 101
  preemptive: true

firewalls:
  - hostname: "SITE-FW-A"
    staging_ip: "192.0.2.10"
    management_ip: "198.51.100.10"
    serial: "000000000001"
    role: primary
  - hostname: "SITE-FW-B"
    staging_ip: "192.0.2.11"
    management_ip: "198.51.100.11"
    serial: "000000000002"
    role: secondary
