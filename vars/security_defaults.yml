  - name: FlileBlocking-Outbound
    category: file_blocking_profiles
    xpath: /config/devices/entry[@name='localhost.localdomain']/vsys/entry[@name='vsys1']/profiles/file-blocking
    spec:
      rules:
        entry:
          - '@name': Block high risk file types
            application:
              member: any
            file-type:
              member:
                - bat
                - chm
                - class
                - cpl
                - dll
                - exe
                - hlp
                - hta
                - jar
                - ocx
                - PE
                - pif
                - rar
                - scr
                - torrent
                - vbe
                - wsf
            direction: both
            action: block
          - '@name': Continue prompt encrypted files
            application:
              member: any
            file-type:
              member:
                - encrypted-rar
                - encrypted-zip
            direction: both
            action: continue
          - '@name': Log all other file types
            application:
              member: any
            file-type:
              member: any
            direction: both
            action: alert
