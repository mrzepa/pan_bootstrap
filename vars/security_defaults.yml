  - name: file_blocking_profiles_FlileBlocking-Outbound
    category: file_blocking_profiles
    xpath: /config/devices/entry[@name='localhost.localdomain']/vsys/entry[@name='vsys1']/profiles/file-blocking
    element: |
      <entry name="FlileBlocking-Outbound">
        <rules>
          <entry name="Block high risk file types">
            <application>
              <member>any</member>
            </application>
            <file-type>
              <member>bat</member>
              <member>chm</member>
              <member>class</member>
              <member>cpl</member>
              <member>dll</member>
              <member>exe</member>
              <member>hlp</member>
              <member>hta</member>
              <member>jar</member>
              <member>ocx</member>
              <member>PE</member>
              <member>pif</member>
              <member>rar</member>
              <member>scr</member>
              <member>torrent</member>
              <member>vbe</member>
              <member>wsf</member>
            </file-type>
            <direction>both</direction>
            <action>block</action>
          </entry>
          <entry name="Continue prompt encrypted files">
            <application>
              <member>any</member>
            </application>
            <file-type>
              <member>encrypted-rar</member>
              <member>encrypted-zip</member>
            </file-type>
            <direction>both</direction>
            <action>continue</action>
          </entry>
          <entry name="Log all other file types">
            <application>
              <member>any</member>
            </application>
            <file-type>
              <member>any</member>
            </file-type>
            <direction>both</direction>
            <action>alert</action>
          </entry>
        </rules>
      </entry>
