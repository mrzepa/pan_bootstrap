security_default_profile_groups:
  - pg_name: default
    virus: AV-Outbound
    spyware: AS-Outbound
    vulnerability: Vulnerability-Outbound
    url_filtering: URL-Outbound
    file_blocking: FileBlocking-Alert-All
    state: present
  - pg_name: Internal Security Profile Group
    virus: AV-Internal
    spyware: AS-Internal
    vulnerability: Vulnerability-Internal
    file_blocking: FileBlocking-Alert-All
    wildfire: Wildfire-Internal
    state: present
security_default_log_forwarding_profiles:
  - name: default
    spec:
      match-list:
        entry:
          - '@name': Traffic Logs
            log-type: traffic
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': Threat Logs
            log-type: threat
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': Auth Logs
            log-type: auth
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': Data Logs
            log-type: data
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': Decryption Logs
            log-type: decryption
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': Tunnel Logs
            log-type: tunnel
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': URL Logs
            log-type: url
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
          - '@name': Wildfire Logs
            log-type: wildfire
            filter: All Logs
            send-to-panorama: 'no'
            quarantine: 'no'
security_default_config_elements: []
security_default_config_entries:
  - name: Google-WR3-Profile
    category: certificate_profiles
    xpath: /config/shared/certificate-profile
    spec:
      CA:
        entry:
          - '@name': Google-WR3
            default-ocsp-url: http://o.pki.goog/wr3
          - '@name': GTS-Root-R1
      use-crl: 'no'
