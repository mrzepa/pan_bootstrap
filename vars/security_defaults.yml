---
# Generated from lab firewall 192.168.4.62.
# Re-run tools/export_security_defaults.py after updating the source objects.
security_default_certificates:
  - name: Google-WR3
    file: files/certificates/Google-WR3.pem
    format: pem
    state: present
  - name: GTS-Root-R1
    file: files/certificates/GTS-Root-R1.pem
    format: pem
    state: present
security_default_external_dynamic_lists:
  - name: Microsoft365-ELD-URLs
    edl_type: url
    source: https://saasedl.paloaltonetworks.com/feeds/m365/worldwide/any/all/url
    certificate_profile: Google-WR3-Profile
    state: present
    repeat: weekly
    repeat_at: '00'
    repeat_day_of_week: sunday
  - name: Azure-Public-Cloud-IPs
    edl_type: ip
    source: https://saasedl.paloaltonetworks.com/feeds/azure/public/any/ipv4
    certificate_profile: Google-WR3-Profile
    state: present
    repeat: weekly
    repeat_at: '21'
    repeat_day_of_week: sunday
  - name: PANW-Canada-AIOps-IP
    edl_type: ip
    source: https://saasedl.paloaltonetworks.com/feeds/panw/ai-ops/canada/url
    certificate_profile: Google-WR3-Profile
    state: present
    repeat: weekly
    repeat_at: '12'
    repeat_day_of_week: sunday
  - name: PANW-USA-AIOps-IP
    edl_type: ip
