security_default_profile_groups:
  - pg_name: default
    virus: AV-Outbound
    spyware: AS-Outbound
    vulnerability: Vulnerability-Outbound
    url_filtering: URL-Outbound
    file_blocking: FileBlocking-Alert-All
    state: present
  - pg_name: "Internal Security Profile Group"
    virus: AV-Internal
    spyware: AS-Internal
    vulnerability: Vulnerability-Internal
    file_blocking: FileBlocking-Alert-All
    wildfire: Wildfire-Internal
    state: present
security_default_log_forwarding_profiles:
  - name: default
    spec:
      match-list:
        entry:
          - "@name": Traffic Logs
            log-type: traffic
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": Threat Logs
            log-type: threat
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": Auth Logs
            log-type: auth
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": Data Logs
            log-type: data
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": Decryption Logs
            log-type: decryption
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": Tunnel Logs
            log-type: tunnel
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": URL Logs
            log-type: url
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
          - "@name": Wildfire Logs
            log-type: wildfire
            filter: All Logs
            send-to-panorama: "no"
            quarantine: "no"
security_default_config_elements:
  - name: certificate_profiles_Google-WR3-Profile
    category: certificate_profiles
    xpath: /config/shared/certificate-profile
    element: |
      <entry name="Google-WR3-Profile">
        <CA>
          <entry name="Google-WR3">
            <default-ocsp-url>http://o.pki.goog/wr3</default-ocsp-url>
          </entry>
          <entry name="GTS-Root-R1" />
        </CA>
        <use-crl>no</use-crl>
      </entry>
  - name: anti_spyware_profiles_AS-Outbound
    category: anti_spyware_profiles
    xpath: /config/devices/entry[@name='localhost.localdomain']/vsys/entry[@name='vsys1']/profiles/spyware
    element: |
      <entry name="AS-Outbound">
        <rules>
          <entry name="simple-critical">
            <action>
              <reset-both />
            </action>
            <severity>
              <member>critical</member>
            </severity>
            <threat-name>any</threat-name>
            <category>any</category>
            <packet-capture>disable</packet-capture>
          </entry>
          <entry name="simple-high">
            <action>
              <reset-both />
            </action>
            <severity>
              <member>high</member>
            </severity>
            <threat-name>any</threat-name>
            <category>any</category>
            <packet-capture>disable</packet-capture>
          </entry>
          <entry name="simple-medium">
            <action>
              <reset-both />
