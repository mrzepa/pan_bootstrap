      rules:
        entry:
          - '@name': simple-critical
            action:
              reset-both: {}
            severity:
              member: critical
            threat-name: any
            category: any
            packet-capture: disable
          - '@name': simple-high
            action:
              reset-both: {}
            severity:
              member: high
            threat-name: any
            category: any
            packet-capture: disable
          - '@name': simple-medium
